name: Build Oraxen

on:
  workflow_dispatch: # Позволяет запускать сборку кнопкой вручную
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ВАЖНО: Oraxen использует Git для генерации версии (grgit).
          # Без fetch-depth: 0 сборка упадет с ошибкой "No .git directory found".
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # Проверьте build.gradle.kts в репозитории:
          # Для 1.20.5–1.21.x используется '21', для 26.x может требоваться '25'.
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # Опция -x test пропускает юнит-тесты и ускоряет компиляцию
        run: ./gradlew build -x test --no-daemon
        env:
          CI: "true" # Гарантирует сборку только под Paper/Purpur

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oraxen-purpur
          # Ищет готовый .jar в директориях сборки
          path: |
            build/libs/*.jar
            **/build/libs/*.jar
          retention-days: 5
