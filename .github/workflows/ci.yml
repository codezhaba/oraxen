name: Build and Package Oraxen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Build Plugin JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Нужно для Grgit, чтобы сформировать корректную версию плагина

      - name: Set up Java 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Package plugin
        # Собираем NMS-модули и упаковываем итоговый JAR-файл
        run: ./gradlew :nms:java21:compileJava :nms:java25:compileJava assemble -x test --parallel --build-cache
        env:
          CI: "true"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oraxen-purpur
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          retention-days: 5
